name: Send review reminders

# Hourly cron: finds every profile whose opt-in reminder hour (stored in UTC)
# matches the current hour, and pushes a notification if they have reviews
# due. Also runnable by hand for testing.
#
# Web and native (FCM) are each optional and independent — see
# send-review-reminders.mjs. Without VITE_VAPID_PUBLIC_KEY + VAPID_PRIVATE_KEY
# there's no way to sign a web push; without FCM_SERVICE_ACCOUNT_JSON there's
# no way to reach the native app. Missing either logs that channel as skipped
# rather than failing; only having BOTH unset exits 0 with nothing sent. It
# used to run red every hour for exactly this reason, which made a real
# misconfiguration look like noise.
# Web: generate a keypair with `npx web-push generate-vapid-keys`.
# Native: Firebase console → Project settings → Service accounts → Generate
# new private key, minified to one line (see .env.example).

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: send-reminders
  cancel-in-progress: true

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Send due reminders
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ vars.VAPID_SUBJECT }}
          FCM_SERVICE_ACCOUNT_JSON: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}
        run: node send-review-reminders.mjs
