name: Send review reminders

# Hourly cron: finds every profile whose opt-in reminder hour (stored in UTC)
# matches the current hour, and pushes a notification if they have reviews
# due. Also runnable by hand for testing.
#
# REQUIRES A VAPID KEYPAIR. Without VITE_VAPID_PUBLIC_KEY + VAPID_PRIVATE_KEY in
# the repository secrets there is no way to sign a push, so the script logs that
# push is not configured and exits 0 rather than failing — it ran red every hour
# for exactly this reason, which made a real misconfiguration look like noise.
# Generate one with `npx web-push generate-vapid-keys`.

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: send-reminders
  cancel-in-progress: true

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Send due reminders
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ vars.VAPID_SUBJECT }}
        run: node send-review-reminders.mjs
