name: CI

# The gate. `npm run verify:pr` runs on every pull request and on every push to
# main. That npm script — not this file — is the definition of what the gate
# is; read package.json to see what it covers.
#
# Before this existed the only PR check was Playwright (e2e.yml) — so the ~1,700
# vitest specs, the ESLint baseline and the build itself never blocked a merge,
# and since most work went straight to `main` (which auto-deploys to Vercel), a
# red suite could reach real users. `/ship` runs the same command, so a local
# pass and a CI pass mean the same thing by construction rather than by anyone
# remembering to keep two lists in step.
#
# Push is limited to main (matching e2e.yml): a branch with a PR used to run
# the same job twice per commit — once for the push, once for the PR event —
# which doubled the wait to merge for zero extra signal. A branch pushed
# WITHOUT a PR gets no CI now; open the PR and it runs.

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch supersedes an in-flight run. Never cancel on
# `main` — that run is the record of what was deployed.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 22+: @supabase/supabase-js v2 needs a global WebSocket at
          # createClient time. Matches regen-content.yml.
          node-version: 22
          cache: npm
      - run: npm ci

      # The whole gate, in one command. `npm run verify:pr` in package.json is
      # the executable source of truth for what the gate IS — deliberately not
      # restated here, because a second description is a second thing to drift.
      # This job used to open-code its stages, and CLAUDE.md and /ship both went
      # on describing "the three checks CI runs" long after it had grown to six.
      #
      # Two things worth knowing that the script cannot say itself:
      #   * Its stage ORDER is load-bearing. The build variants share dist/, and
      #     the bundle guard inspects whatever built last — so a reordering
      #     makes it check the wrong artifact and pass for the wrong reason.
      #     verification-contract.test.mjs pins that order and adjacency.
      #   * No secrets are needed. src/supabase.js only reads VITE_SUPABASE_* at
      #     runtime, so a build with them unset still compiles. This checks the
      #     bundle, not the configuration.
      #
      # Playwright is deliberately NOT here — it stays its own PR job in
      # e2e.yml.
      - name: Verify (npm run verify:pr)
        run: npm run verify:pr
