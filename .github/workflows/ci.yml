name: CI

# The gate. `npm run verify:pr` runs on every pull request and on every push to
# main. That npm script — not this file — is the definition of what the gate
# is; see package.json.
#
# Before this existed the only PR check was Playwright (e2e.yml) — so the ~1,700
# vitest specs, the ESLint baseline and the build itself never blocked a merge,
# and since most work went straight to `main` (which auto-deploys to Vercel), a
# red suite could reach real users. `/ship` runs the same command, so a local
# pass and a CI pass mean the same thing by construction rather than by anyone
# remembering to keep two lists in step.
#
# Push is limited to main (matching e2e.yml): a branch with a PR used to run
# the same job twice per commit — once for the push, once for the PR event —
# which doubled the wait to merge for zero extra signal. A branch pushed
# WITHOUT a PR gets no CI now; open the PR and it runs.

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch supersedes an in-flight run. Never cancel on
# `main` — that run is the record of what was deployed.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 22+: @supabase/supabase-js v2 needs a global WebSocket at
          # createClient time. Matches regen-content.yml.
          node-version: 22
          cache: npm
      - run: npm ci

      # The whole gate, in one command. `npm run verify:pr` is the executable
      # source of truth: CI runs it, `/ship` runs it, and an agent verifying its
      # own work runs it — so none of them can pass a gate the others would
      # fail. It used to be six steps open-coded here, which drifted: CLAUDE.md
      # and /ship both still described "the three checks CI runs" long after
      # this job grew to six.
      #
      # What it covers, in this order, and why the order is load-bearing:
      #   1. lint            — 0 errors in src/
      #   2. unit tests      — the full vitest suite
      #   3. build           — the Sites variant, which also emits hq.html
      #   4. build:public    — the bundle the App Store and Play actually ship
      #   5. verify:public-bundle — nothing internal inside that bundle
      #   6. verify-app-icons     — the assets the App Store would reject
      # Steps 3 and 4 both write dist/client, and step 5 inspects whatever built
      # last. Reordering them makes the guard check the wrong artifact and pass
      # for the wrong reason. verification-contract.test.mjs pins the order.
      #
      # No secrets: src/supabase.js only reads VITE_SUPABASE_* at runtime, so a
      # build with them unset still compiles. This checks the bundle, not config.
      #
      # Playwright is deliberately NOT here — it stays its own PR job in
      # e2e.yml. Native (build:native + the font guard) is not here either yet.
      - name: Verify (lint, tests, both builds, bundle + icon guards)
        run: npm run verify:pr
