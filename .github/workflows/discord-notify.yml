name: Discord notifications

# Posts a "🚀 Update shipped" card to #announcements on every push to main,
# listing the non-merge commits in that push. That is all this workflow does.
#
# #roadmap and #backlog are NOT here. They used to be: this file carried its own
# copy of the roadmap renderer, and roadmap-live-sync.yml carried another. Both
# PATCHed the SAME pinned messages by the same id files, with different
# rendering rules — so what the community saw flipped between two versions
# depending on which workflow ran last. Both also committed a newly-created
# message id straight to main. There is now one owner of those two channels,
# .github/workflows/roadmap-live-sync.yml, and it writes nothing.
#
# Setup (one time):
#   1. In Discord: #announcements ⚙ → Integrations → Webhooks → New Webhook.
#   2. In GitHub: repo Settings → Secrets and variables → Actions → New secret
#        DISCORD_ANNOUNCE_WEBHOOK = the #announcements webhook URL
#   The step skips if the secret is missing.

on:
  push:
    branches: [main]

# Read-only: nothing here writes to the repository. The roadmap message-id
# commits that once needed `contents: write` live nowhere now.
permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Post changelog to #announcements
        env:
          WEBHOOK: ${{ secrets.DISCORD_ANNOUNCE_WEBHOOK }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          COMPARE: ${{ github.event.compare }}
        run: |
          if [ -z "$WEBHOOK" ]; then echo "DISCORD_ANNOUNCE_WEBHOOK not set — skipping"; exit 0; fi
          if git rev-parse --verify "$BEFORE^{commit}" >/dev/null 2>&1; then
            NOTES=$(git log --no-merges --pretty=format:'• %s' "$BEFORE..$AFTER" | head -20)
          else
            NOTES=$(git log --no-merges --pretty=format:'• %s' -1 "$AFTER")
          fi
          if [ -z "$NOTES" ]; then echo "No non-merge commits to report"; exit 0; fi
          jq -n --arg desc "$NOTES" --arg url "$COMPARE" \
            '{embeds:[{title:"🚀 Update shipped", description:$desc, url:$url, color:12073508, footer:{text:"Hanzi Dojo"}}]}' \
            > announce.json
          curl -sS -H "Content-Type: application/json" -d @announce.json "$WEBHOOK"
