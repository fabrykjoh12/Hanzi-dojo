name: Visual regression baselines

# Regenerates the committed screenshot baselines for tests/e2e/visual.spec.js
# and commits them back to the branch this was dispatched on.
#
# Baselines MUST come from this workflow, not a local run: font rasterization
# differs between machines, and the E2E workflow that consumes the baselines
# runs on this same ubuntu-latest image — capture and comparison have to share
# a renderer. Dispatch this after an intentional visual change (or when the
# runner image update shifts rendering), review the committed diff, done.
#
# THE `mode` INPUT, AND WHY IT HAD TO EXIST.
#
# The default, `changed`, rewrites only the snapshots whose comparison FAILS.
# Comparison runs at playwright.config.js's maxDiffPixelRatio: 0.02 — on the
# 1280x800 desktop captures that is 20,480 pixels of tolerance. A text edit
# confined to a line or two is a few thousand differing pixels, so it passes,
# and `changed` therefore leaves the baseline alone. The run goes green and
# reports "Baselines unchanged — nothing to commit", which reads like "no
# visual change" when what it means is "the change was under tolerance".
#
# That is fine for the check itself and wrong for the artifact: the committed
# PNG is also the human-readable record of what a page says, and one showing
# text the app no longer displays misleads the next reader. `all` rewrites
# every snapshot unconditionally, which is what you want after an intentional
# copy change.
#
# Observed on 2026-08-26: naming the controller in the privacy policy changed a
# visible line of the page and `changed` committed nothing (run 33007027135).
#
# Use `changed` for layout/rendering shifts, `all` after an intentional copy
# edit. Note the corollary — a small copy regression will NOT fail the e2e
# visual check either; these snapshots catch layout breakage, not wording.
#
# ⚠️ The commit is pushed with the workflow's own GITHUB_TOKEN, so — like the
# manhua-art-fetch commits (see docs/BACKLOG.md) — it does NOT trigger CI on
# the PR. The baseline images can't break lint/test/build, but the check list
# on the PR's head commit will look thin; push any real change on top to get a
# full run.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'changed = rewrite only snapshots that fail comparison; all = rewrite every snapshot'
        required: false
        default: changed
        type: choice
        options: [changed, all]

permissions:
  contents: write

concurrency:
  group: visual-baseline
  cancel-in-progress: false

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          # Don't leave a writable token in git config while npm ci and the
          # tests run — repo code must not be able to push. The token is
          # supplied inline on the final push only.
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Capture baselines
        run: npx playwright test tests/e2e/visual.spec.js --update-snapshots=${{ inputs.mode || 'changed' }}
      - name: Commit baselines
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/visual.spec.js-snapshots
          if git diff --cached --quiet; then
            echo "Baselines unchanged — nothing to commit."
          else
            git -c core.hooksPath=/dev/null commit -m "test(visual): update screenshot baselines (CI-rendered)"
            git -c core.hooksPath=/dev/null push \
              "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
              "HEAD:${GITHUB_REF_NAME}"
          fi
