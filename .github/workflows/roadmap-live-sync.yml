name: Roadmap live sync

# Mirrors the CANONICAL ROADMAP.md and docs/BACKLOG.md — the versions on main —
# into their pinned Discord messages, editing each message in place.
#
# WHAT CHANGED, AND WHY IT MATTERS
#
# This workflow used to run on pushes to NON-main branches. It copied that
# branch's two doc files onto main with `git checkout <branch> -- <file>` and
# pushed, so a branch could change main without a PR, a review or a merge. The
# copy was a whole-file replacement, not a merge, so the last branch to push
# won and any newer content on main was silently reverted. That is not
# hypothetical: 42e367a deleted 83 lines of docs/BACKLOG.md that 27358b5 had
# added from another branch, and 015fe1e restored them an hour later.
#
# The rule now is the ordinary one, with no exception for docs:
#
#     branch → PR → merge → main → Discord
#
# A non-main branch cannot reach main here, because this workflow no longer
# writes anything at all. It has `contents: read`, runs no git command, and
# only ever PATCHes an existing Discord message. Editing the roadmap on a
# feature branch is normal work; the community sees it when the PR merges.
#
# ID FILES ARE CONFIGURATION, NOT STATE
#
# .github/roadmap-message.id and .github/backlog-message.id name the messages to
# edit. They are read, never written. If one is missing or Discord rejects the
# edit, the run FAILS with instructions rather than quietly posting a fresh
# message and committing its id back to main — the old behaviour, and another
# way a workflow mutated the repository behind everyone's back.
#
#   .github/backlog-message.id does not exist yet. Until someone bootstraps it
#   (see .github/scripts/roadmap-sync.mjs), the backlog target fails loudly
#   whenever DISCORD_BACKLOG_WEBHOOK is set. The roadmap still syncs — every
#   target is attempted before the run fails.
#
# Secrets (a target whose webhook is unset simply skips):
#   DISCORD_ROADMAP_WEBHOOK  → #roadmap
#   DISCORD_BACKLOG_WEBHOOK  → the private #backlog channel
#
# The rendering lives in .github/scripts/roadmap-render.mjs and is covered by
# roadmap-render.test.mjs; the invariants in this file are pinned by
# roadmap-sync.test.mjs. Both run in `npm test`.

on:
  push:
    branches: [main]
    paths:
      - ROADMAP.md
      - docs/BACKLOG.md
      - .github/roadmap-message.id
      - .github/backlog-message.id
      - .github/scripts/roadmap-render.mjs
      - .github/scripts/roadmap-sync.mjs
      - .github/workflows/roadmap-live-sync.yml
  workflow_dispatch: {}   # manual "re-sync Discord from main now"

# Read-only. This workflow has no reason to write to the repository, and the
# absence of `contents: write` is what makes that structural rather than a
# promise. roadmap-sync.test.mjs fails if it ever comes back.
permissions:
  contents: read

# One at a time, newest wins: a run started by an older main push is cancelled
# by a newer one, so Discord can never be overwritten with stale content by a
# run that happened to finish late.
concurrency:
  group: roadmap-live-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # `on.push.branches` already restricts pushes, but workflow_dispatch can
      # be aimed at any branch from the Actions UI. That is the one remaining
      # way a branch could put its own doc text into the community channel, so
      # it is refused explicitly rather than left to convention.
      - name: Refuse to sync from anything but main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Discord is synced from main only. This run is on ${{ github.ref }}."
          echo "Merge the change to main and the sync runs on its own."
          exit 1

      # The canonical revision, and the only thing this job reads.
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Edit the pinned Discord messages
        env:
          DISCORD_ROADMAP_WEBHOOK: ${{ secrets.DISCORD_ROADMAP_WEBHOOK }}
          DISCORD_BACKLOG_WEBHOOK: ${{ secrets.DISCORD_BACKLOG_WEBHOOK }}
        run: node .github/scripts/roadmap-sync.mjs
