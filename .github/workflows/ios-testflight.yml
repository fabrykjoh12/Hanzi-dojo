name: iOS build → TestFlight

# Builds the iOS app on a GitHub-hosted Mac and uploads it to TestFlight.
#
# Why this exists: nobody on the project has a Mac, and an iOS build cannot
# happen anywhere else. This runner is that Mac. The repository is public, so
# macOS minutes cost nothing.
#
# Signing without a Mac is the part that usually blocks this, and letting
# Xcode sort it out does NOT work: under automatic signing `xcodebuild archive`
# asks Apple for an iOS App *Development* profile, and Apple refuses to issue
# one to a team with no registered devices. There is no iPhone on this project
# to register, so that route is permanently closed.
#
# So the signing assets are built explicitly instead: openssl makes a key and
# a certificate signing request on the runner, the App Store Connect API turns
# that into a distribution certificate and an App Store provisioning profile,
# and the archive is signed manually against them. No device, no Mac, no
# Keychain Access. See .github/scripts/asc-signing-assets.mjs.
#
# Required repository secrets (App Store Connect → Users and Access →
# Integrations → App Store Connect API):
#   ASC_KEY_ID       the key's 10-character ID
#   ASC_ISSUER_ID    the issuer UUID shown above the key list
#   ASC_PRIVATE_KEY  the whole .p8 file contents, BEGIN/END lines included
#   APPLE_TEAM_ID    the 10-character team ID
#
# ⚠️ That is a DIFFERENT key from the Sign-in-with-Apple one. This key can
# upload builds; it cannot sign anyone in.

on:
  workflow_dispatch:
    inputs:
      upload:
        description: 'Upload to TestFlight (unticked = build and archive only)'
        type: boolean
        default: false

concurrency:
  group: ios-build
  cancel-in-progress: false

jobs:
  build:
    # macos-26, not macos-15: App Store Connect rejects anything built with an
    # SDK older than iOS 26, and the iOS 26 SDK ships with Xcode 26. A build on
    # the older image archives and signs perfectly and then fails at upload,
    # which is an expensive way to find out.
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      # Runner images carry several Xcodes and the default is not always the
      # newest. Pick the highest and say so, rather than inheriting whichever
      # one happens to be selected.
      - name: Select Xcode
        run: |
          set -euo pipefail
          NEWEST="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          sudo xcode-select -s "$NEWEST"
          xcodebuild -version
          MAJOR="$(xcodebuild -version | head -1 | sed -E 's/Xcode ([0-9]+).*/\1/')"
          if [ "$MAJOR" -lt 26 ]; then
            echo "::error::Xcode $MAJOR is too old — App Store Connect requires the iOS 26 SDK."
            echo "Available: $(ls -d /Applications/Xcode*.app | tr '\n' ' ')"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The web build the app actually ships. NOT `npm run build` — that one
      # emits the internal HQ page (see vite.config.js).
      - name: Build the web app
        run: npm run build:public

      - name: Sync into the iOS project
        run: npx cap sync ios

      - name: Check the secrets are present
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=""
          [ -z "$ASC_KEY_ID" ] && missing="$missing ASC_KEY_ID"
          [ -z "$ASC_ISSUER_ID" ] && missing="$missing ASC_ISSUER_ID"
          [ -z "$ASC_PRIVATE_KEY" ] && missing="$missing ASC_PRIVATE_KEY"
          [ -z "$APPLE_TEAM_ID" ] && missing="$missing APPLE_TEAM_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing"
            echo "Create them from App Store Connect → Users and Access → Integrations → App Store Connect API."
            exit 1
          fi
          echo "All four secrets are set."

      # xcodebuild looks for API keys in this exact location.
      - name: Install the App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          mkdir -p ~/private_keys
          printf '%s' "$ASC_PRIVATE_KEY" > ~/private_keys/AuthKey_${ASC_KEY_ID}.p8
          chmod 600 ~/private_keys/AuthKey_${ASC_KEY_ID}.p8

      # openssl generates the private key and CSR that would normally come from
      # Keychain Access on a Mac; the API turns the CSR into a certificate.
      # The key never leaves the runner and dies with it.
      - name: Create the signing certificate and profile
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          SIGN_DIR="$RUNNER_TEMP/signing"
          mkdir -p "$SIGN_DIR"

          # /usr/bin/openssl on purpose: Homebrew's OpenSSL 3 writes PKCS#12
          # files that macOS `security import` cannot read without -legacy.
          /usr/bin/openssl req -new -newkey rsa:2048 -nodes \
            -keyout "$SIGN_DIR/key.pem" -out "$SIGN_DIR/request.csr" \
            -subj "/CN=Hanzi Dojo CI/O=Hanzi Dojo/C=NO"

          node .github/scripts/asc-signing-assets.mjs "$SIGN_DIR/request.csr" "$SIGN_DIR" \
            | tee "$SIGN_DIR/assets.log"

          grep -E '^PROFILE_(NAME|UUID)=' "$SIGN_DIR/assets.log" >> "$GITHUB_ENV"
          echo "SIGN_DIR=$SIGN_DIR" >> "$GITHUB_ENV"

      - name: Install them where Xcode looks
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          # Random per run, and only ever unlocks this throwaway keychain.
          PW="$(/usr/bin/openssl rand -base64 24)"
          echo "::add-mask::$PW"

          /usr/bin/openssl x509 -inform DER -in "$SIGN_DIR/cert.cer" -out "$SIGN_DIR/cert.pem"
          /usr/bin/openssl pkcs12 -export \
            -inkey "$SIGN_DIR/key.pem" -in "$SIGN_DIR/cert.pem" \
            -out "$SIGN_DIR/identity.p12" -passout "pass:$PW"

          security create-keychain -p "$PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$PW" "$KEYCHAIN"
          security import "$SIGN_DIR/identity.p12" -k "$KEYCHAIN" -P "$PW" \
            -T /usr/bin/codesign -T /usr/bin/security
          # Without this, codesign blocks on a UI prompt that no one can answer.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$PW" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db

          PROFILES="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES"
          cp "$SIGN_DIR/profile.mobileprovision" "$PROFILES/$PROFILE_UUID.mobileprovision"

          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

          # Fail here rather than 10 minutes later in the middle of the archive.
          security find-identity -v -p codesigning "$KEYCHAIN"
          if ! security find-identity -v -p codesigning "$KEYCHAIN" | grep -q "Apple Distribution"; then
            echo "::error::No Apple Distribution identity in the keychain — the certificate did not import."
            exit 1
          fi

      # Every upload needs a build number App Store Connect has not seen. The
      # run number is monotonic and never reused, which is exactly the property
      # required — the marketing version (1.0) is left to the release process.
      - name: Set the build number
        run: |
          cd ios/App
          xcrun agvtool new-version -all ${{ github.run_number }}
          echo "Build number: ${{ github.run_number }}"

      # No xcpretty here. Piping through it swallowed the real compiler and
      # signing errors AND hid the failure itself — the step went green while
      # the archive had failed, and only the next step revealed it. The full
      # log goes to a file; on failure the actual error lines are printed.
      #
      # Manual signing, against the certificate and profile made above. There
      # is no -allowProvisioningUpdates: letting Xcode "fix" provisioning is
      # exactly what fails here.
      - name: Archive
        run: |
          set -o pipefail
          cd ios/App
          xcodebuild archive \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            CODE_SIGN_ENTITLEMENTS=App/App.entitlements \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN" \
            2>&1 | tee "$RUNNER_TEMP/archive.log" | tail -40 || {
              echo "::group::What actually failed"
              grep -nE "error:|error |fatal|No profiles|No signing certificate|Provisioning|requires a provisioning|Signing for" "$RUNNER_TEMP/archive.log" | tail -60 || true
              echo "::endgroup::"
              echo "::group::Last 120 lines"
              tail -120 "$RUNNER_TEMP/archive.log"
              echo "::endgroup::"
              exit 1
            }

      - name: Export the IPA
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.hanzidojo.app</key><string>$PROFILE_NAME</string>
            </dict>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN" \
            2>&1 | tee "$RUNNER_TEMP/export.log" | tail -40 || {
              echo "::group::What actually failed"
              grep -nE "error:|error |No profiles|No signing certificate|Provisioning" "$RUNNER_TEMP/export.log" | tail -40 || true
              echo "::endgroup::"
              exit 1
            }

      - name: Keep the IPA even if the upload is skipped
        uses: actions/upload-artifact@v4
        with:
          name: hanzi-dojo-ios-${{ github.run_number }}
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload to TestFlight
        if: ${{ inputs.upload }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          IPA=$(ls "$RUNNER_TEMP"/export/*.ipa | head -1)
          echo "Uploading $IPA"
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: What happens next
        run: |
          if [ "${{ inputs.upload }}" = "true" ]; then
            echo "Uploaded. App Store Connect takes 5–15 minutes to process the build,"
            echo "then it appears under TestFlight and can be installed on a phone."
          else
            echo "Archive + export succeeded; nothing was uploaded."
            echo "Re-run with 'upload' ticked to send it to TestFlight."
          fi
