name: iOS signing check

# Read-only diagnostic. Asks App Store Connect what signing assets the team
# actually has — certificates, devices, bundle IDs, profiles — and whether the
# API key is allowed to create them.
#
# It exists because the TestFlight build kept failing on provisioning and the
# error messages describe the symptom, not the cause. This turns the guessing
# into facts. It creates nothing and changes nothing.

on:
  workflow_dispatch:

jobs:
  # The job id is the check-run name GitHub reports, and required checks are
  # matched by that name plus the producing integration — not by the workflow
  # file. This job used to be called `check`, which collided with ci.yml's
  # canonical required `check` from the same GitHub Actions App, so a manual
  # dispatch could put a second `check` run on a commit and make required-check
  # identity ambiguous. Keep this id distinct from every required context.
  ios-signing-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Ask App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: node .github/scripts/asc-signing-check.mjs
