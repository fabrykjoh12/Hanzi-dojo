name: Regenerate vocabulary content

# Manually-triggered job that regenerates the AI meanings and/or example
# sentences for the vocabulary, running on GitHub's servers (which can reach
# Supabase + Groq). Trigger from the Actions tab → "Run workflow".

on:
  workflow_dispatch:
    inputs:
      task:
        description: What to regenerate
        type: choice
        default: both
        options: [meanings, examples, examples-fill, both, comprehension, comprehension-prune, clean-meanings, deactivate-awkward, seed-hsk2, audio-hsk1, audio-hsk2, stories-hsk2, examples-hsk3-6, audio-hsk3-6, tts-flashcards, serial-hsk3-6, seed-n4, audio-n4, stories-n4, seed-russian, audio-russian, examples-russian, stories-russian, stories-hsk1-replace, stories-hsk2-replace, stories-jlpt1-replace, publish-held-jlpt1, audio-jlpt1, audio-jlpt2, story-audio-hsk1, story-audio-hsk2, story-audio-hsk3, story-audio-jlpt1, story-audio-jlpt2, story-audio-n4, story-audio-russian, serial-hsk1, serial-hsk2, serial-jlpt1, serial-jlpt1-more, serial-jlpt2, serial-n4, serial-russian, story-images-list, story-images-apply, authored-vocab-hsk1, authored-vocab-hsk2, authored-vocab-hsk3, authored-vocab-hsk4, authored-vocab-hsk5, authored-vocab-hsk6, authored-vocab-jlpt1, authored-vocab-n4, authored-vocab-russian, authored-insert, normalize-readings, normalize-readings-apply]
      language:
        description: Which language
        type: choice
        default: both
        options: [both, japanese, chinese]
      story_tier:
        description: "serial-* only: generate just this tier (1/2/3) as a taste test. Blank = whole level."
        type: choice
        default: ''
        options: ['', '1', '2', '3']
      level:
        description: "examples-fill / tts-flashcards: just this level (e.g. 3). Blank = every level."
        type: string
        default: ''
      tts_limit:
        description: "tts-flashcards only: how many source records (words) to voice. Above 200 needs override."
        type: string
        default: '20'
      tts_ids:
        description: "tts-flashcards only: comma-separated vocabulary row ids — voice exactly these rows (level is ignored)."
        type: string
        default: ''
      tts_confirm:
        description: "tts-flashcards only: actually spend money. Unticked = dry run that bills nothing."
        type: boolean
        default: false

permissions:
  contents: read

# Don't run two regenerations at once (they'd fight over the same rows).
concurrency:
  group: regen-content
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22   # 22 has a global WebSocket, which supabase-js needs
          cache: npm
      - run: npm ci
      - name: Regenerate
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # LLM provider: llm.mjs prefers GEMINI_API_KEY (Gemini Flash), falls back
          # to GROQ_API_KEY. Optionally override LLM_MODEL / LLM_BASE_URL.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          # Premium tier for the serial-story pipeline only (see llm.mjs's
          # premiumLlm) — bulk tasks never use this key.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LLM_MODEL_PREMIUM: ${{ vars.LLM_MODEL_PREMIUM }}
          # Google TTS is only still here for the legacy `audio-*` tasks below.
          # New synthesis goes through tts-generate.mjs on Azure.
          GOOGLE_TTS_KEY: ${{ secrets.VITE_GOOGLE_TTS_KEY }}
          # Azure Speech — the provider tts-generate.mjs actually bills. A dry
          # run works without these; only --confirm requires them.
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
          TTS_CONCURRENCY: ${{ vars.TTS_CONCURRENCY }}
        run: |
          set -e
          LANG_FLAG=""
          case "${{ inputs.language }}" in
            japanese) LANG_FLAG="--japanese" ;;
            chinese)  LANG_FLAG="--chinese" ;;
          esac
          # serial-* taste test: restrict to one tier when story_tier is set.
          TIER_FLAG=""
          if [ -n "${{ inputs.story_tier }}" ]; then TIER_FLAG="--tier ${{ inputs.story_tier }}"; fi

          if [ "${{ inputs.task }}" = "meanings" ] || [ "${{ inputs.task }}" = "both" ]; then
            echo "::group::Meanings"
            node generate-meanings.mjs $LANG_FLAG
            echo "::endgroup::"
          fi

          if [ "${{ inputs.task }}" = "examples" ] || [ "${{ inputs.task }}" = "both" ]; then
            echo "::group::Example sentences (regenerate ALL)"
            node generate-examples.mjs $LANG_FLAG --regen
            echo "::endgroup::"
          fi

          if [ "${{ inputs.task }}" = "examples-fill" ]; then
            LEVEL_FLAG=""
            if [ -n "${{ inputs.level }}" ]; then LEVEL_FLAG="--level ${{ inputs.level }}"; fi
            echo "::group::Example sentences (fill only missing — safe for new levels) $LEVEL_FLAG"
            node generate-examples.mjs $LANG_FLAG $LEVEL_FLAG
            echo "::endgroup::"
          fi

          if [ "${{ inputs.task }}" = "comprehension" ]; then
            echo "::group::Story comprehension questions"
            node generate-comprehension.mjs $LANG_FLAG
            echo "::endgroup::"
          fi

          if [ "${{ inputs.task }}" = "comprehension-prune" ]; then
            echo "::group::Prune trivial comprehension questions, then regenerate them"
            node generate-comprehension.mjs --prune
            node generate-comprehension.mjs $LANG_FLAG
            echo "::endgroup::"
          fi

          if [ "${{ inputs.task }}" = "clean-meanings" ]; then
            echo "::group::Clean meanings (deterministic)"
            node clean-meanings.mjs $LANG_FLAG --apply
            echo "::endgroup::"
          fi

          if [ "${{ inputs.task }}" = "deactivate-awkward" ]; then
            echo "::group::Deactivate awkward vocab (counter-suffixes + duplicate readings)"
            node deactivate-awkward-vocab.mjs --apply
            echo "::endgroup::"
          fi

          if [ "${{ inputs.task }}" = "seed-hsk2" ]; then
            echo "::group::Seed HSK 3.0 level 2 vocabulary from data/hsk2.json"
            node seed-vocab.mjs --file data/hsk2.json --language chinese --system hsk_3 --level 2 --apply
            echo "::endgroup::"
          fi

          if [ "${{ inputs.task }}" = "audio-hsk1" ]; then
            echo "::group::Regenerate HSK 3.0 level 1 audio (Google TTS, pinyin-pinned)"
            node generate-audio.mjs --language chinese --system hsk_3 --level 1
            echo "::endgroup::"
          fi

          if [ "${{ inputs.task }}" = "audio-hsk2" ]; then
            echo "::group::Generate HSK 3.0 level 2 audio (Google TTS)"
            node generate-audio.mjs --language chinese --system hsk_3 --level 2
            echo "::endgroup::"
          fi

          if [ "${{ inputs.task }}" = "stories-hsk2" ]; then
            echo "::group::Generate HSK 3.0 level 2 stories"
            node generate-stories.mjs --language chinese --system hsk_3 --level 2
            echo "::endgroup::"
          fi

          if [ "${{ inputs.task }}" = "examples-hsk3-6" ]; then
            echo "::group::HSK 3-6 example sentences from Tatoeba (free, fills only missing)"
            node backfill-examples.mjs --levels 3-6 --apply
            echo "::endgroup::"
          fi

          if [ "${{ inputs.task }}" = "audio-hsk3-6" ]; then
            echo "::error::audio-hsk3-6 is retired — it billed Google TTS, not Azure."
            echo "Use task 'tts-flashcards' (Azure, via tts-generate.mjs) with level/tts_limit/tts_confirm."
            exit 1
          fi

          # Azure synthesis. tts-generate.mjs is the only script in the repo that
          # spends money on speech, and its safety model is deliberate: a DRY RUN
          # unless --confirm, and a 200-record hard cap that --override-max must
          # unlock. This task surfaces those controls rather than bypassing them,
          # so a mistyped level costs a dry run instead of a bill.
          if [ "${{ inputs.task }}" = "tts-flashcards" ]; then
            LEVEL_FLAG=""
            if [ -n "${{ inputs.level }}" ]; then LEVEL_FLAG="--level ${{ inputs.level }}"; fi
            # A targeted run (e.g. re-voicing rows whose reading was corrected)
            # names its exact vocabulary ids; that overrides any level filter.
            ID_FLAG=""
            if [ -n "${{ inputs.tts_ids }}" ]; then ID_FLAG="--id ${{ inputs.tts_ids }}"; LEVEL_FLAG=""; fi
            LANG_NAME="${{ inputs.language }}"
            if [ "$LANG_NAME" = "both" ]; then LANG_NAME="chinese"; fi
            case "$LANG_NAME" in
              chinese)  SYSTEM=hsk_3 ;;
              japanese) SYSTEM=jlpt ;;
              *)        SYSTEM=hsk_3 ;;
            esac
            LIMIT="${{ inputs.tts_limit }}"
            OVERRIDE=""
            if [ "$LIMIT" -gt 200 ] 2>/dev/null; then OVERRIDE="--override-max"; fi
            CONFIRM=""
            if [ "${{ inputs.tts_confirm }}" = "true" ]; then CONFIRM="--confirm"; fi
            if [ -z "$CONFIRM" ]; then
              echo "DRY RUN — nothing will be billed. Tick tts_confirm to generate."
            fi
            echo "::group::Azure TTS · $LANG_NAME/$SYSTEM $LEVEL_FLAG · limit $LIMIT"
            node tts-generate.mjs \
              --flashcards --missing-only \
              --language "$LANG_NAME" --system "$SYSTEM" $LEVEL_FLAG $ID_FLAG \
              --limit "$LIMIT" $OVERRIDE $CONFIRM
            echo "::endgroup::"
          fi

          if [ "${{ inputs.task }}" = "serial-hsk3-6" ]; then
            echo "::group::Generate HSK 3-6 serial stories"
            for lvl in 3 4 5 6; do
              echo "--- level $lvl ---"
              node generate-serial-stories.mjs --language chinese --system hsk_3 --level $lvl $TIER_FLAG
            done
            echo "::endgroup::"
          fi

          if [ "${{ inputs.task }}" = "stories-hsk1-replace" ]; then
            echo "::group::REPLACE HSK 1 stories (deletes existing, regenerates longer story-first versions)"
            node generate-stories.mjs --language chinese --system hsk_3 --level 1 --replace
            echo "::endgroup::"
          fi

          if [ "${{ inputs.task }}" = "stories-hsk2-replace" ]; then
            echo "::group::REPLACE HSK 2 stories (deletes existing, regenerates longer story-first versions)"
            node generate-stories.mjs --language chinese --system hsk_3 --level 2 --replace
            echo "::endgroup::"
          fi

          if [ "${{ inputs.task }}" = "stories-jlpt1-replace" ]; then
            echo "::group::REPLACE JLPT N5 Part 1 (japanese level 1) stories (deletes existing kana-only stories, regenerates in kanji)"
            node generate-stories.mjs --language japanese --system jlpt --level 1 --replace
            echo "::endgroup::"
          fi

          if [ "${{ inputs.task }}" = "publish-held-jlpt1" ]; then
            echo "::group::Publish held (is_published=false) JLPT N5 Part 1 stories"
            node publish-stories.mjs --language japanese --system jlpt --level 1 --apply
            echo "::endgroup::"
          fi

          if [ "${{ inputs.task }}" = "seed-n4" ]; then
            echo "::group::Seed JLPT N4 (japanese level 3) vocabulary from data/n4.json"
            node seed-vocab.mjs --file data/n4.json --language japanese --system jlpt --level 3 --apply
            echo "::endgroup::"
          fi

          if [ "${{ inputs.task }}" = "audio-n4" ]; then
            echo "::group::Generate JLPT N4 audio (Google TTS)"
            node generate-audio.mjs --language japanese --system jlpt --level 3
            echo "::endgroup::"
          fi

          if [ "${{ inputs.task }}" = "audio-jlpt1" ]; then
            echo "::group::Regenerate JLPT N5 Part 1 (japanese level 1) audio (Google TTS)"
            node generate-audio.mjs --language japanese --system jlpt --level 1
            echo "::endgroup::"
          fi

          if [ "${{ inputs.task }}" = "audio-jlpt2" ]; then
            echo "::group::Regenerate JLPT N5 Part 2 (japanese level 2) audio (Google TTS)"
            node generate-audio.mjs --language japanese --system jlpt --level 2
            echo "::endgroup::"
          fi

          if [ "${{ inputs.task }}" = "stories-n4" ]; then
            echo "::group::Generate JLPT N4 stories"
            node generate-stories.mjs --language japanese --system jlpt --level 3
            echo "::endgroup::"
          fi

          if [ "${{ inputs.task }}" = "seed-russian" ]; then
            echo "::group::Seed Russian CEFR A1 (russian level 1) vocabulary from data/russian-a1.json"
            node seed-vocab.mjs --file data/russian-a1.json --language russian --system russian --level 1 --apply
            echo "::endgroup::"
          fi

          if [ "${{ inputs.task }}" = "audio-russian" ]; then
            echo "::group::Generate Russian A1 audio (Google TTS, ru-RU)"
            node generate-audio.mjs --language russian --system russian --level 1
            echo "::endgroup::"
          fi

          if [ "${{ inputs.task }}" = "examples-russian" ]; then
            echo "::group::Russian example sentences (fill only missing — safe for new level)"
            node generate-examples.mjs --russian
            echo "::endgroup::"
          fi

          if [ "${{ inputs.task }}" = "stories-russian" ]; then
            echo "::group::Generate Russian A1 stories"
            node generate-stories.mjs --language russian --system russian --level 1
            echo "::endgroup::"
          fi

          if [ "${{ inputs.task }}" = "story-audio-hsk1" ]; then
            echo "::group::Generate narration for HSK 3.0 level 1 stories (Google TTS)"
            node generate-story-audio.mjs --language chinese --system hsk_3 --level 1
            echo "::endgroup::"
          fi

          if [ "${{ inputs.task }}" = "story-audio-hsk2" ]; then
            echo "::group::Generate narration for HSK 3.0 level 2 stories (Google TTS)"
            node generate-story-audio.mjs --language chinese --system hsk_3 --level 2
            echo "::endgroup::"
          fi

          if [ "${{ inputs.task }}" = "story-audio-hsk3" ]; then
            echo "::group::Generate narration for HSK 3.0 level 3 stories (Google TTS)"
            node generate-story-audio.mjs --language chinese --system hsk_3 --level 3
            echo "::endgroup::"
          fi

          if [ "${{ inputs.task }}" = "story-audio-jlpt1" ]; then
            echo "::group::Generate narration for JLPT N5 Part 1 (japanese level 1) stories (Google TTS)"
            node generate-story-audio.mjs --language japanese --system jlpt --level 1
            echo "::endgroup::"
          fi

          if [ "${{ inputs.task }}" = "story-audio-jlpt2" ]; then
            echo "::group::Generate narration for JLPT N5 Part 2 (japanese level 2) stories (Google TTS)"
            node generate-story-audio.mjs --language japanese --system jlpt --level 2
            echo "::endgroup::"
          fi

          if [ "${{ inputs.task }}" = "story-audio-n4" ]; then
            echo "::group::Generate narration for JLPT N4 (japanese level 3) stories (Google TTS)"
            node generate-story-audio.mjs --language japanese --system jlpt --level 3
            echo "::endgroup::"
          fi

          if [ "${{ inputs.task }}" = "story-audio-russian" ]; then
            echo "::group::Generate narration for Russian A1 stories (Google TTS)"
            node generate-story-audio.mjs --language russian --system russian --level 1
            echo "::endgroup::"
          fi

          if [ "${{ inputs.task }}" = "serial-hsk1" ]; then
            echo "::group::REPLACE HSK 1 stories with serial chapters (multi-pass pipeline)"
            node generate-serial-stories.mjs --language chinese --system hsk_3 --level 1 --replace $TIER_FLAG
            echo "::endgroup::"
          fi

          if [ "${{ inputs.task }}" = "serial-hsk2" ]; then
            echo "::group::REPLACE HSK 2 stories with serial chapters (multi-pass pipeline)"
            node generate-serial-stories.mjs --language chinese --system hsk_3 --level 2 --replace $TIER_FLAG
            echo "::endgroup::"
          fi

          if [ "${{ inputs.task }}" = "serial-jlpt1" ]; then
            echo "::group::REPLACE JLPT N5 Part 1 stories with serial chapters (multi-pass pipeline)"
            node generate-serial-stories.mjs --language japanese --system jlpt --level 1 --replace $TIER_FLAG
            echo "::endgroup::"
          fi

          if [ "${{ inputs.task }}" = "serial-jlpt1-more" ]; then
            echo "::group::APPEND three new JLPT N5 Part 1 seasons (keeps existing stories; fresh premises)"
            node generate-serial-stories.mjs --language japanese --system jlpt --level 1 --season-offset 3 $TIER_FLAG
            echo "::endgroup::"
          fi

          if [ "${{ inputs.task }}" = "serial-jlpt2" ]; then
            echo "::group::REPLACE JLPT N5 Part 2 (japanese level 2) stories with serial chapters (multi-pass pipeline)"
            node generate-serial-stories.mjs --language japanese --system jlpt --level 2 --replace $TIER_FLAG
            echo "::endgroup::"
          fi

          if [ "${{ inputs.task }}" = "serial-n4" ]; then
            echo "::group::REPLACE JLPT N4 stories with serial chapters (multi-pass pipeline)"
            node generate-serial-stories.mjs --language japanese --system jlpt --level 3 --replace $TIER_FLAG
            echo "::endgroup::"
          fi

          if [ "${{ inputs.task }}" = "serial-russian" ]; then
            echo "::group::REPLACE Russian A1 stories with serial chapters (multi-pass pipeline)"
            node generate-serial-stories.mjs --language russian --system russian --level 1 --replace $TIER_FLAG
            echo "::endgroup::"
          fi

          if [ "${{ inputs.task }}" = "story-images-list" ]; then
            echo "::group::List published stories as JSON (for authoring cover art)"
            node generate-story-images.mjs --list
            echo "::endgroup::"
          fi

          if [ "${{ inputs.task }}" = "story-images-apply" ]; then
            echo "::group::Apply story cover art from data/story-covers.json"
            node generate-story-images.mjs --apply data/story-covers.json
            echo "::endgroup::"
          fi

          if [ "${{ inputs.task }}" = "authored-vocab-hsk1" ]; then
            echo "::group::Dump HSK 1 vocabulary (for authoring stories)"
            node authored-stories.mjs --list-vocab --language chinese --system hsk_3 --level 1
            echo "::endgroup::"
          fi

          if [ "${{ inputs.task }}" = "authored-vocab-hsk2" ]; then
            echo "::group::Dump HSK 2 vocabulary (for authoring stories)"
            node authored-stories.mjs --list-vocab --language chinese --system hsk_3 --level 2
            echo "::endgroup::"
          fi

          if [ "${{ inputs.task }}" = "authored-vocab-hsk3" ]; then
            echo "::group::Dump HSK 3 vocabulary (for authoring stories)"
            node authored-stories.mjs --list-vocab --language chinese --system hsk_3 --level 3
            echo "::endgroup::"
          fi

          if [ "${{ inputs.task }}" = "authored-vocab-hsk4" ]; then
            echo "::group::Dump HSK 4 vocabulary (for authoring stories)"
            node authored-stories.mjs --list-vocab --language chinese --system hsk_3 --level 4
            echo "::endgroup::"
          fi

          if [ "${{ inputs.task }}" = "authored-vocab-hsk5" ]; then
            echo "::group::Dump HSK 5 vocabulary (for authoring stories)"
            node authored-stories.mjs --list-vocab --language chinese --system hsk_3 --level 5
            echo "::endgroup::"
          fi

          if [ "${{ inputs.task }}" = "authored-vocab-hsk6" ]; then
            echo "::group::Dump HSK 6 vocabulary (for authoring stories)"
            node authored-stories.mjs --list-vocab --language chinese --system hsk_3 --level 6
            echo "::endgroup::"
          fi

          if [ "${{ inputs.task }}" = "authored-vocab-jlpt1" ]; then
            echo "::group::Dump JLPT N5 Part 1 vocabulary (for authoring stories)"
            node authored-stories.mjs --list-vocab --language japanese --system jlpt --level 1
            echo "::endgroup::"
          fi

          if [ "${{ inputs.task }}" = "authored-vocab-n4" ]; then
            echo "::group::Dump JLPT N4 vocabulary (for authoring stories)"
            node authored-stories.mjs --list-vocab --language japanese --system jlpt --level 3
            echo "::endgroup::"
          fi

          if [ "${{ inputs.task }}" = "authored-vocab-russian" ]; then
            echo "::group::Dump Russian A1 vocabulary (for authoring stories)"
            node authored-stories.mjs --list-vocab --language russian --system russian --level 1
            echo "::endgroup::"
          fi

          if [ "${{ inputs.task }}" = "normalize-readings" ]; then
            echo "::group::Normalize HSK 3-6 pinyin readings to the joined form (DRY RUN — TTS phoneme pinning)"
            node normalize-readings.mjs --language chinese --system hsk_3 --levels 3-6
            echo "::endgroup::"
          fi

          if [ "${{ inputs.task }}" = "normalize-readings-apply" ]; then
            echo "::group::Normalize HSK 3-6 pinyin readings to the joined form (WRITE). Re-run audio afterwards."
            node normalize-readings.mjs --language chinese --system hsk_3 --levels 3-6 --apply
            echo "::endgroup::"
          fi

          if [ "${{ inputs.task }}" = "authored-insert" ]; then
            echo "::group::Insert authored stories from data/authored-stories.json"
            node authored-stories.mjs --insert data/authored-stories.json
            echo "::endgroup::"
          fi
