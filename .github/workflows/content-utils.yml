name: Content utilities

# Short content-maintenance tasks (seconds to a minute) in their OWN workflow
# and concurrency group, so they never wait behind — or knock out of the
# queue — the hours-long story-generation runs in regen-content.yml.

on:
  workflow_dispatch:
    inputs:
      task:
        description: What to run
        type: choice
        default: story-images-apply
        options: [story-images-apply, publish-held, fix-collisions, fix-vocab-kanji, fix-vocab-kanji-apply, manhua-art-fetch, manhua-publish, check-published, content-integrity, content-integrity-accept]
      language:
        description: "publish-held only: language of the level to publish"
        type: string
        default: japanese
      system:
        description: "publish-held only: system of the level to publish"
        type: string
        default: jlpt
      level:
        description: "publish-held only: level number to publish"
        type: string
        default: '1'
      tier:
        description: "publish-held only: restrict to one tier (blank = all)"
        type: string
        default: ''
      manifest:
        description: "manhua-art-fetch / manhua-publish only: the file to act on. Blank = that task's default (the .art.json for a fetch, the episode JSON for a publish)"
        type: string
        default: ''
      force:
        description: "manhua-art-fetch only: re-fetch art that is already committed"
        type: boolean
        default: false

# manhua-art-fetch commits the art it fetches back to the branch it was
# dispatched on (see fetch-manhua-art.mjs for why episode art is committed
# rather than uploaded to the storage bucket). Every other task here is
# read-only against the repo and writes only to Supabase.
permissions:
  contents: write

concurrency:
  group: content-utils
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run task
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # manhua-publish refuses to publish an episode whose panel art is not
          # yet on the live site. This is the site it checks.
          SITE_URL: https://hanzi-dojo.com
          # Every dispatch input reaches the shell as an environment VARIABLE,
          # never as ${{ }} interpolated into the script. Interpolation splices
          # the value in as shell SOURCE, so a manifest containing a quote and a
          # semicolon would run commands — in a job that holds the service key.
          TASK: ${{ inputs.task }}
          LANGUAGE: ${{ inputs.language }}
          SYSTEM: ${{ inputs.system }}
          LEVEL: ${{ inputs.level }}
          TIER: ${{ inputs.tier }}
          MANIFEST: ${{ inputs.manifest }}
          FORCE: ${{ inputs.force }}
        run: |
          set -e
          if [ "$TASK" = "story-images-apply" ]; then
            node generate-story-images.mjs --apply data/story-covers.json
          fi
          if [ "$TASK" = "publish-held" ]; then
            TIER_FLAG=""
            if [ -n "$TIER" ]; then TIER_FLAG="--tier $TIER"; fi
            node publish-stories.mjs --language "$LANGUAGE" --system "$SYSTEM" --level "$LEVEL" $TIER_FLAG --apply
          fi
          if [ "$TASK" = "fix-collisions" ]; then
            node publish-stories.mjs --language "$LANGUAGE" --system "$SYSTEM" --level "$LEVEL" --fix-collisions --apply
          fi
          if [ "$TASK" = "content-integrity" ]; then
            # Compare-only. Directional against the accepted baseline: existing
            # debt may shrink freely, any new debt fails the run. This is the
            # path CI takes and it never writes the baseline.
            node check-content-integrity.mjs
          fi
          if [ "$TASK" = "content-integrity-accept" ]; then
            # The explicit, reviewed action that ACCEPTS new debt, and the only
            # path that writes the baseline. Never on main: accepting debt is a
            # reviewed change, so it goes through a branch and a pull request
            # where the diff IS the review. The guard lives here rather than
            # resting on a branch-protection setting, which lives elsewhere and
            # can be changed without this repo noticing.
            if [ "$GITHUB_REF_NAME" = "main" ]; then
              echo "Refusing to rewrite the content-integrity baseline on main."
              echo "Dispatch this on a branch and open a pull request."
              exit 1
            fi
            node check-content-integrity.mjs --update-baseline
          fi
          if [ "$TASK" = "check-published" ]; then
            node check-published-stories.mjs
          fi
          if [ "$TASK" = "fix-vocab-kanji" ]; then
            node fix-vocab-kanji.mjs
          fi
          if [ "$TASK" = "fix-vocab-kanji-apply" ]; then
            node fix-vocab-kanji.mjs --apply
          fi
          # The two manhua tasks share one `manifest` input but need different
          # files — a fetch reads the .art.json (urls), a publish reads the
          # episode JSON (content). Blank means "this task's own default", so
          # dispatching either one without typing a path does the right thing
          # instead of failing with "Episode has no content".
          if [ "$TASK" = "manhua-art-fetch" ]; then
            FILE="${MANIFEST:-data/manhua/inkbound-hsk1-ep01.art.json}"
            if [ "$FORCE" = "true" ]; then
              node fetch-manhua-art.mjs "$FILE" --force
            else
              node fetch-manhua-art.mjs "$FILE"
            fi
          fi
          if [ "$TASK" = "manhua-publish" ]; then
            node publish-manhua.mjs "${MANIFEST:-data/manhua/inkbound-hsk1-ep01.json}" --apply
          fi
      - name: Commit the accepted content-integrity baseline
        # Branch only. github.ref_name is checked here as well as inside the
        # task, so there is no path in this workflow that pushes an accepted
        # baseline to main.
        if: inputs.task == 'content-integrity-accept' && github.ref_name != 'main'
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -e
          if [ "$BRANCH" = "main" ]; then echo "refusing to push a baseline to main"; exit 1; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/content-integrity-baseline.json
          if git diff --cached --quiet; then
            echo "Baseline unchanged."
            exit 0
          fi
          git commit -m "content: accept the current content-integrity baseline" \
            -m "Regenerated by check-content-integrity.mjs --update-baseline against the live published corpus. Every entry is a Mandarin token in a published story that the Reader cannot resolve. Accepting them freezes the debt at this level: it may shrink from here, and the compare-only task fails the run if any new debt appears."
          git push origin "HEAD:$BRANCH"

      - name: Commit fetched art
        if: inputs.task == 'manhua-art-fetch'
        env:
          MANIFEST: ${{ inputs.manifest }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -e
          FILE="${MANIFEST:-data/manhua/inkbound-hsk1-ep01.art.json}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          DIR=$(node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")).dir)' "$FILE")
          git add -A "$DIR"
          if git diff --cached --quiet; then
            echo "No new art to commit."
            exit 0
          fi
          git commit -m "art: fetch manhua art from $FILE"
          git push origin "HEAD:$BRANCH"
