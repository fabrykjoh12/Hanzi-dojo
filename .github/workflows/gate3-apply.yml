name: Gate 3 — Apply approved manifest

# Applies EXACTLY the manifest a specific Prepare run produced. It never
# re-derives what to do, never classifies afresh, and never runs unattended:
# the `gate3-production` environment must have a required reviewer, so GitHub
# holds the job until a human approves it.
#
# Three independent things must line up before a single row is written:
#   1. the operator names the Prepare run (prepare_run_id)
#   2. the operator pastes that run's manifest digest (manifest_sha256), and
#      this job recomputes it after decrypting — a mismatch aborts
#   3. the checked-out code is the same commit Prepare recorded
#
# The migration script's own compare-and-swap is untouched: every UPDATE still
# carries its precondition in its WHERE clause, so a row graded between Prepare
# and Apply is skipped as STALE_ROW rather than overwritten.
#
# 20260822180000 (the scheduler-state constraint) is NOT run here. It is a
# separate gate, after these invariants are confirmed clean.

on:
  workflow_dispatch:
    inputs:
      prepare_run_id:
        description: 'Run ID of the Gate 3 — Prepare run to apply'
        required: true
        type: string
      manifest_sha256:
        description: 'manifest_sha256 from that run summary (64 hex chars)'
        required: true
        type: string
      migration_ref:
        description: 'Exact commit SHA Prepare used (full 40-char SHA)'
        required: true
        type: string
      confirm:
        description: 'Type APPLY-TO-PRODUCTION to confirm'
        required: true
        type: string

permissions:
  contents: read
  actions: read      # to download the Prepare run's artifact

concurrency:
  group: gate3
  cancel-in-progress: false

jobs:
  apply:
    name: Apply to production
    runs-on: ubuntu-latest
    # REQUIRED REVIEWER lives here. Configure gate3-production with at least
    # one reviewer; GitHub will pause this job until it is approved.
    environment: gate3-production
    timeout-minutes: 30

    steps:
      - name: Check confirmation
        if: inputs.confirm != 'APPLY-TO-PRODUCTION'
        run: |
          echo "::error::confirm must be exactly APPLY-TO-PRODUCTION"
          exit 1

      - name: Check out the approved migration commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.migration_ref }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Download the Prepare bundle
        uses: actions/download-artifact@v4
        with:
          name: gate3-prepare-${{ inputs.prepare_run_id }}
          run-id: ${{ inputs.prepare_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/gate3-in

      - name: Verify the bundle belongs to the approved commit and run
        run: |
          meta=/tmp/gate3-in/gate3-metadata.json
          test -s "$meta" || { echo "::error::metadata missing from the bundle"; exit 1; }
          cat "$meta"
          node -e '
            const fs = require("fs");
            const m = JSON.parse(fs.readFileSync("/tmp/gate3-in/gate3-metadata.json","utf8"));
            const want = {
              migration_commit: process.env.MIGRATION_REF,
              prepare_run_id: process.env.PREPARE_RUN_ID,
              manifest_sha256: process.env.MANIFEST_SHA256,
            };
            const bad = Object.entries(want).filter(([k,v]) => String(m[k]) !== String(v));
            if (bad.length) {
              console.error("::error::bundle does not match the approval inputs");
              for (const [k,v] of bad) console.error(`  ${k}: bundle ${m[k]} vs requested ${v}`);
              process.exit(1);
            }
            console.log("bundle matches commit, run id and manifest digest");
          '
        env:
          MIGRATION_REF: ${{ inputs.migration_ref }}
          PREPARE_RUN_ID: ${{ inputs.prepare_run_id }}
          MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}

      - name: Decrypt the manifest and re-verify its digest
        env:
          MANIFEST_PASSPHRASE: ${{ secrets.GATE3_MANIFEST_PASSPHRASE }}
          MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
        run: |
          mkdir -p /tmp/gate3 && chmod 700 /tmp/gate3
          gpg --batch --yes --quiet --passphrase-fd 0 --decrypt \
              --output /tmp/gate3/manifest.json /tmp/gate3-in/manifest.json.gpg <<< "$MANIFEST_PASSPHRASE"
          actual="$(sha256sum /tmp/gate3/manifest.json | awk '{print $1}')"
          if [ "$actual" != "$MANIFEST_SHA256" ]; then
            echo "::error::manifest digest mismatch — refusing to apply"
            echo "::error::expected $MANIFEST_SHA256, got $actual"
            exit 1
          fi
          echo "manifest digest verified: $actual"

      # The manifest is a photograph. The script re-reads every row and applies
      # only where the recorded precondition still holds; anything that moved is
      # reported STALE_ROW and skipped, never forced.
      - name: Apply the approved manifest
        env:
          # Reuses the repository's existing secrets — Gate 3 introduces no
          # duplicate copy of the Supabase credentials. This mapping
          # (VITE_SUPABASE_URL -> SUPABASE_URL) is the same one
          # content-utils.yml and regen-content.yml already use.
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          node migrate-legacy-claims.mjs \
            --apply --manifest /tmp/gate3/manifest.json --redact | tee /tmp/gate3/apply.log

      - name: Post-apply invariants
        env:
          # Reuses the repository's existing secrets — Gate 3 introduces no
          # duplicate copy of the Supabase credentials. This mapping
          # (VITE_SUPABASE_URL -> SUPABASE_URL) is the same one
          # content-utils.yml and regen-content.yml already use.
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          node migrate-legacy-claims.mjs --redact | tee /tmp/gate3/post.log

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Gate 3 — Apply"
            echo
            echo "Manifest \`${{ inputs.manifest_sha256 }}\` from run \`${{ inputs.prepare_run_id }}\`."
            echo
            echo '### Apply'
            echo '```'
            tail -n 40 /tmp/gate3/apply.log 2>/dev/null || echo '(no apply log)'
            echo '```'
            echo '### Post-apply census'
            echo '```'
            sed -n '/CLASSIFICATION/,/BATCH CORROBORATION/p' /tmp/gate3/post.log 2>/dev/null || echo '(no post log)'
            echo '```'
            echo
            echo "> \`20260822180000\` has NOT been applied. That is a separate gate."
          } >> "$GITHUB_STEP_SUMMARY"

      # Redacted logs only — no manifest, no snapshot, no identifiers.
      - name: Upload redacted apply logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate3-apply-${{ github.run_id }}
          path: |
            /tmp/gate3/apply.log
            /tmp/gate3/post.log
          retention-days: 7
          if-no-files-found: warn
