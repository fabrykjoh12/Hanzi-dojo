name: LLM provider smoke test and story benchmark

# Two supervised modes for choosing the story-generation model on the keys we
# already have. Neither mode touches Supabase, stages, or publishes anything —
# both only write files under reports/ and data/story-candidates/.
#
#   mode: smoke  — inventory the keys (presence only, never values), ask each
#                  provider's /models endpoint what it actually serves today,
#                  then send ONE minimal Chinese request per candidate model
#                  and report success/error/latency/tokens.
#   mode: bench  — generate the SAME manifests with model A and model B, then
#                  cross-judge: B scores A's stories, A scores B's, semantic
#                  quality only. The deterministic validator remains the sole
#                  authority on PASS/FAIL in both runs.
#
# Dispatch on the branch whose pipeline code you want to run; results are
# committed back to that branch.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "smoke = probe; bench = benchmark; select = K-draft selection (production flow); duo = retired edit flow (diagnostic); writer-test = one draft"
        type: choice
        options: [smoke, bench, duo, select, writer-test, patch-test, repair-test, quality-gate, blueprint, planner-bakeoff, target-bundle]
        default: smoke
      max_tests:
        description: "smoke only: how many models to probe (capped at 16)"
        type: string
        default: '12'
      probe_models:
        description: "smoke only: explicit list, e.g. groq:qwen/qwen3-32b,gemini:gemini-2.5-pro. Blank = auto-select."
        type: string
        default: ''
      reasoning_effort:
        description: "smoke only: Groq reasoning_effort (none / low / medium / high). Qwen3 needs 'none' or it only thinks."
        type: string
        default: ''
      effort_a:
        description: "bench only: reasoning_effort for model A (blank = send none). Per-model: what Qwen needs, gpt-oss may reject."
        type: string
        default: ''
      effort_b:
        description: "bench only: reasoning_effort for model B"
        type: string
        default: ''
      model_a:
        description: "bench only: provider:model for generator A"
        type: string
        default: ''
      model_b:
        description: "bench only: provider:model for generator B (blank = single-model run)"
        type: string
        default: ''
      writer_max_tokens:
        description: "writer-test only: max_tokens override for full-thinking runs (capped 4800; blank = pipeline budget)"
        type: string
        default: ''
      stage_name:
        description: "patch-test only: which stored stage to patch (e.g. draft-1)"
        type: string
        default: 'draft-1'
      drafts_k:
        description: "select only: independent drafts per manifest (capped 5)"
        type: string
        default: '3'
      broad_stage:
        description: "duo only: broad-failure stage — self-condense (writer edits itself) or editor (gpt-oss simplify)"
        type: string
        default: 'self-condense'
      manifest_path:
        description: "writer-test / duo / patch-test / repair-test: repo path of a stored candidate to reuse verbatim. quality-gate: 'none' composes fresh manifests (an empty value falls back to this default)"
        type: string
        default: 'data/story-candidates/duo-2/duo-2-L3-002.json'
      batch_prefix:
        description: "bench only: names data/story-candidates/<prefix>-a and -b"
        type: string
        default: 'bench-1'
      level:
        description: "bench only: HSK level"
        type: string
        default: '3'
      count:
        description: "bench only: manifests per model (hard-capped at 4)"
        type: string
        default: '4'

permissions:
  contents: write

concurrency:
  group: llm-bench
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # ── smoke ────────────────────────────────────────────────────────────
      - name: Provider inventory and model probes
        if: inputs.mode == 'smoke'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_MODEL_PREMIUM: ${{ vars.LLM_MODEL_PREMIUM }}
          MAX_TESTS: ${{ inputs.max_tests }}
          PROBE_MODELS: ${{ inputs.probe_models }}
          EFFORT: ${{ inputs.reasoning_effort }}
        run: |
          set -e
          case "$MAX_TESTS" in (*[!0-9]*|"") MAX_TESTS=12;; esac
          [ "$MAX_TESTS" -gt 16 ] && MAX_TESTS=16
          EFFORT_FLAG=""
          case "$EFFORT" in
            "") ;;
            none|low|medium|high) EFFORT_FLAG="--reasoning-effort $EFFORT";; 
            *) echo "bad reasoning_effort"; exit 1;;
          esac
          if [ -n "$PROBE_MODELS" ]; then
            case "$PROBE_MODELS" in (*[!A-Za-z0-9._/:,-]*) echo "bad probe_models"; exit 1;; esac
            node llm-smoke-test.mjs --models "$PROBE_MODELS" $EFFORT_FLAG --out reports/llm-smoke.json
          else
            node llm-smoke-test.mjs --max-tests "$MAX_TESTS" $EFFORT_FLAG --out reports/llm-smoke.json
          fi

      # ── bench ────────────────────────────────────────────────────────────
      - name: Fresh corpus dump (read-only)
        if: inputs.mode == 'bench'
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node dump-story-corpus.mjs --out reports/story-corpus-dump.json

      - name: Generate and cross-judge
        if: inputs.mode == 'bench'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MODEL_A: ${{ inputs.model_a }}
          MODEL_B: ${{ inputs.model_b }}
          PREFIX: ${{ inputs.batch_prefix }}
          LEVEL: ${{ inputs.level }}
          COUNT: ${{ inputs.count }}
          EFFORT_A: ${{ inputs.effort_a }}
          EFFORT_B: ${{ inputs.effort_b }}
        run: |
          set -e
          # Reasoning control is per model: Qwen3 needs it off to write at all,
          # while a model that does not accept the parameter would 400 on it.
          effort_flag () {
            case "$1" in
              "") echo "";;
              none|low|medium|high) echo "--reasoning-effort $1";;
              *) echo "bad reasoning_effort: $1" >&2; exit 1;;
            esac
          }
          FLAG_A=$(effort_flag "$EFFORT_A")
          FLAG_B=$(effort_flag "$EFFORT_B")
          case "$PREFIX" in (*[!A-Za-z0-9_-]*|"") echo "bad batch_prefix"; exit 1;; esac
          case "$LEVEL" in (*[!0-9]*|"") echo "bad level"; exit 1;; esac
          case "$COUNT" in (*[!0-9]*|"") COUNT=4;; esac
          [ "$COUNT" -gt 4 ] && COUNT=4
          for spec in "$MODEL_A" "$MODEL_B"; do
            [ -z "$spec" ] && continue
            case "$spec" in (*[!A-Za-z0-9._/:-]*) echo "bad model spec: $spec"; exit 1;; esac
          done
          [ -z "$MODEL_A" ] && { echo "model_a is required for bench"; exit 1; }

          gen () {   # gen <spec> <suffix> <effort-flag>
            prov="${1%%:*}"; mdl="${1#*:}"
            echo "::group::generate $prov/$mdl → ${PREFIX}-$2"
            node generate-targeted-stories.mjs \
              --input reports/story-corpus-dump.json \
              --level "$LEVEL" --count "$COUNT" --batch "${PREFIX}-$2" \
              --provider "$prov" --model "$mdl" $3
            echo "::endgroup::"
          }
          gen "$MODEL_A" a "$FLAG_A"
          [ -n "$MODEL_B" ] && gen "$MODEL_B" b "$FLAG_B"

          judge () { # judge <judge-spec> <batch-suffix> <effort-flag>
            prov="${1%%:*}"; mdl="${1#*:}"
            dir="data/story-candidates/${PREFIX}-$2"
            [ -d "$dir" ] || return 0
            echo "::group::judge $dir with $prov/$mdl"
            node judge-story-candidates.mjs --batch "$dir" --provider "$prov" --model "$mdl" $3
            echo "::endgroup::"
          }
          # Cross-judging: neither model grades its own homework.
          if [ -n "$MODEL_B" ]; then
            judge "$MODEL_B" a "$FLAG_B"
            judge "$MODEL_A" b "$FLAG_A"
          else
            judge "$MODEL_A" a "$FLAG_A"
          fi

      - name: Fresh corpus dump for duo/select (read-only)
        if: inputs.mode == 'duo' || inputs.mode == 'select'
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node dump-story-corpus.mjs --out reports/story-corpus-dump.json

      - name: "Generate (duo = retired edit flow, select = K-draft selection)"
        if: inputs.mode == 'duo' || inputs.mode == 'select'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MODEL_A: ${{ inputs.model_a }}      # writer
          MODEL_B: ${{ inputs.model_b }}      # editor
          EFFORT_A: ${{ inputs.effort_a }}
          EFFORT_B: ${{ inputs.effort_b }}
          PREFIX: ${{ inputs.batch_prefix }}
          LEVEL: ${{ inputs.level }}
          COUNT: ${{ inputs.count }}
          BROAD_STAGE: ${{ inputs.broad_stage }}
          MANIFEST: ${{ inputs.manifest_path }}
          MODE: ${{ inputs.mode }}
          DRAFTS_K: ${{ inputs.drafts_k }}
        run: |
          set -e
          case "$PREFIX" in (*[!A-Za-z0-9_-]*|"") echo "bad batch_prefix"; exit 1;; esac
          case "$LEVEL" in (*[!0-9]*|"") echo "bad level"; exit 1;; esac
          case "$COUNT" in (*[!0-9]*|"") COUNT=2;; esac
          [ "$COUNT" -gt 4 ] && COUNT=4
          for spec in "$MODEL_A" "$MODEL_B"; do
            case "$spec" in (""|*[!A-Za-z0-9._/:-]*) echo "bad or missing model spec: $spec"; exit 1;; esac
          done
          case "$BROAD_STAGE" in (self-condense|editor) ;; (*) echo "bad broad_stage"; exit 1;; esac
          MANIFEST_FLAG=""
          if [ -n "$MANIFEST" ]; then
                case "$MANIFEST" in (*[!A-Za-z0-9._/,-]*|/*|*..*) echo "bad manifest_path"; exit 1;; esac
            [ -f "$MANIFEST" ] || { echo "manifest not found: $MANIFEST"; exit 1; }
            MANIFEST_FLAG="--manifest $MANIFEST"
          fi
          W_EFFORT=""; [ -n "$EFFORT_A" ] && W_EFFORT="--writer-effort $EFFORT_A"
          E_EFFORT=""; [ -n "$EFFORT_B" ] && E_EFFORT="--editor-effort $EFFORT_B"
          case "$DRAFTS_K" in (*[!0-9]*|"") DRAFTS_K=3;; esac
          [ "$DRAFTS_K" -gt 5 ] && DRAFTS_K=5
          node generate-targeted-stories.mjs \
            --input reports/story-corpus-dump.json \
            --level "$LEVEL" --count "$COUNT" --batch "$PREFIX" \
            --provider "$MODE" --writer "$MODEL_A" --editor "$MODEL_B" $W_EFFORT $E_EFFORT \
            --broad-stage "$BROAD_STAGE" --k "$DRAFTS_K" $MANIFEST_FLAG

      - name: Fresh corpus dump for writer-test (read-only)
        if: inputs.mode == 'writer-test'
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node dump-story-corpus.mjs --out reports/story-corpus-dump.json

      - name: Writer test — ONE draft, validated, no editor
        if: inputs.mode == 'writer-test'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MODEL_A: ${{ inputs.model_a }}
          EFFORT_A: ${{ inputs.effort_a }}
          MANIFEST: ${{ inputs.manifest_path }}
          PREFIX: ${{ inputs.batch_prefix }}
          WRITER_MAX_TOKENS: ${{ inputs.writer_max_tokens }}
        run: |
          set -e
          case "$PREFIX" in (*[!A-Za-z0-9_-]*|"") echo "bad batch_prefix"; exit 1;; esac
          case "$MODEL_A" in (""|*[!A-Za-z0-9._/:-]*) echo "bad or missing model_a"; exit 1;; esac
          case "$MANIFEST" in (*[!A-Za-z0-9._/-]*|""|/*|*..*) echo "bad manifest_path"; exit 1;; esac
          [ -f "$MANIFEST" ] || { echo "manifest not found: $MANIFEST"; exit 1; }
          EFFORT_FLAG=""
          case "$EFFORT_A" in
            "") ;;
            none|low|medium|high|default) EFFORT_FLAG="--reasoning-effort $EFFORT_A";;
            *) echo "bad effort_a"; exit 1;;
          esac
          TOKENS_FLAG=""
          case "$WRITER_MAX_TOKENS" in
            "") ;;
            *[!0-9]*) echo "bad writer max tokens"; exit 1;;
            *) [ "$WRITER_MAX_TOKENS" -le 4800 ] && TOKENS_FLAG="--max-tokens $WRITER_MAX_TOKENS";;
          esac
          prov="${MODEL_A%%:*}"; mdl="${MODEL_A#*:}"
          node writer-draft-test.mjs \
            --input reports/story-corpus-dump.json \
            --manifest "$MANIFEST" \
            --provider "$prov" --model "$mdl" $EFFORT_FLAG $TOKENS_FLAG \
            --out "data/story-candidates/$PREFIX"

      - name: Fresh corpus dump for patch-test (read-only)
        if: inputs.mode == 'patch-test'
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node dump-story-corpus.mjs --out reports/story-corpus-dump.json

      - name: "Patch test — bounded structural patch of ONE stored draft"
        if: inputs.mode == 'patch-test'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MODEL_A: ${{ inputs.model_a }}      # patcher
          EFFORT_A: ${{ inputs.effort_a }}
          MODEL_B: ${{ inputs.model_b }}      # critic (runs only on PASS)
          EFFORT_B: ${{ inputs.effort_b }}
          MANIFEST: ${{ inputs.manifest_path }}   # the stored CANDIDATE file
          PREFIX: ${{ inputs.batch_prefix }}
          STAGE: ${{ inputs.stage_name }}
        run: |
          set -e
          case "$PREFIX" in (*[!A-Za-z0-9_-]*|"") echo "bad batch_prefix"; exit 1;; esac
          case "$MODEL_A" in (""|*[!A-Za-z0-9._/:-]*) echo "bad or missing model_a"; exit 1;; esac
          case "$MANIFEST" in (*[!A-Za-z0-9._/-]*|""|/*|*..*) echo "bad manifest_path"; exit 1;; esac
          [ -f "$MANIFEST" ] || { echo "candidate not found: $MANIFEST"; exit 1; }
          case "$STAGE" in (*[!A-Za-z0-9-]*|"") STAGE=draft-1;; esac
          A_EFF=""; case "$EFFORT_A" in ("") ;; (none|low|medium|high|default) A_EFF="--patcher-effort $EFFORT_A";; (*) echo bad; exit 1;; esac
          B_FLAGS=""
          if [ -n "$MODEL_B" ]; then
            case "$MODEL_B" in (*[!A-Za-z0-9._/:-]*) echo "bad model_b"; exit 1;; esac
            B_FLAGS="--critic $MODEL_B"
            case "$EFFORT_B" in ("") ;; (none|low|medium|high|default) B_FLAGS="$B_FLAGS --critic-effort $EFFORT_B";; (*) echo bad; exit 1;; esac
          fi
          node patch-candidate-test.mjs \
            --input reports/story-corpus-dump.json \
            --candidate "$MANIFEST" --stage "$STAGE" \
            --patcher "$MODEL_A" $A_EFF $B_FLAGS \
            --out "data/story-candidates/$PREFIX"

      - name: Fresh corpus dump for repair-test (read-only)
        if: inputs.mode == 'repair-test'
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node dump-story-corpus.mjs --out reports/story-corpus-dump.json

      - name: "Repair test — deterministic plan, then one line at a time"
        if: inputs.mode == 'repair-test'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MODEL_A: ${{ inputs.model_a }}      # line writer 1
          EFFORT_A: ${{ inputs.effort_a }}
          MODEL_B: ${{ inputs.model_b }}      # line writer 2 (compliance is compared, not assumed)
          EFFORT_B: ${{ inputs.effort_b }}
          CRITIC: ${{ inputs.probe_models }}  # critic + semantic ranker/judge, e.g. groq:qwen/qwen3.6-27b
          MANIFEST: ${{ inputs.manifest_path }}   # the stored CANDIDATE file
          PREFIX: ${{ inputs.batch_prefix }}
          STAGE: ${{ inputs.stage_name }}
        run: |
          set -e
          case "$PREFIX" in (*[!A-Za-z0-9_-]*|"") echo "bad batch_prefix"; exit 1;; esac
          case "$MODEL_A" in (""|*[!A-Za-z0-9._/:-]*) echo "bad or missing model_a"; exit 1;; esac
          case "$MANIFEST" in (*[!A-Za-z0-9._/-]*|""|/*|*..*) echo "bad manifest_path"; exit 1;; esac
          [ -f "$MANIFEST" ] || { echo "candidate not found: $MANIFEST"; exit 1; }
          case "$STAGE" in (*[!A-Za-z0-9-]*|"") STAGE=draft-1;; esac
          case "$EFFORT_A" in (""|none|low|medium|high|default) ;; (*) echo "bad effort_a"; exit 1;; esac
          WRITERS="$MODEL_A"; [ -n "$EFFORT_A" ] && WRITERS="$MODEL_A:$EFFORT_A"
          if [ -n "$MODEL_B" ]; then
            case "$MODEL_B" in (*[!A-Za-z0-9._/:-]*) echo "bad model_b"; exit 1;; esac
            case "$EFFORT_B" in (""|none|low|medium|high|default) ;; (*) echo "bad effort_b"; exit 1;; esac
            if [ -n "$EFFORT_B" ]; then WRITERS="$WRITERS,$MODEL_B:$EFFORT_B"; else WRITERS="$WRITERS,$MODEL_B"; fi
          fi
          CRITIC_FLAGS=""
          if [ -n "$CRITIC" ]; then
            case "$CRITIC" in (*[!A-Za-z0-9._/:-]*) echo "bad critic"; exit 1;; esac
            CRITIC_FLAGS="--critic $CRITIC --critic-effort none --ranker $CRITIC --ranker-effort none"
          fi
          node repair-candidate-test.mjs \
            --input reports/story-corpus-dump.json \
            --candidate "$MANIFEST" --stage "$STAGE" \
            --writers "$WRITERS" $CRITIC_FLAGS \
            --out "data/story-candidates/$PREFIX"

      - name: Fresh corpus dump for quality-gate (read-only)
        if: inputs.mode == 'quality-gate'
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node dump-story-corpus.mjs --out reports/story-corpus-dump.json

      - name: "Quality gate — draft, validate, gate, repair only if worth it"
        if: inputs.mode == 'quality-gate'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MODEL_A: ${{ inputs.model_a }}      # primary writer / ranker / judge
          EFFORT_A: ${{ inputs.effort_a }}
          MODEL_B: ${{ inputs.model_b }}      # line-repair fallback only
          EFFORT_B: ${{ inputs.effort_b }}
          MANIFEST: ${{ inputs.manifest_path }}   # stored CANDIDATE file to gate (blank = fresh manifests)
          STAGE: ${{ inputs.stage_name }}
          PREFIX: ${{ inputs.batch_prefix }}
          COUNT: ${{ inputs.count }}
          LEVEL: ${{ inputs.level }}
        run: |
          set -e
          case "$PREFIX" in (*[!A-Za-z0-9_-]*|"") echo "bad batch_prefix"; exit 1;; esac
          case "$MODEL_A" in (""|*[!A-Za-z0-9._/:-]*) echo "bad or missing model_a"; exit 1;; esac
          case "$EFFORT_A" in (""|none|low|medium|high|default) ;; (*) echo "bad effort_a"; exit 1;; esac
          case "$COUNT" in (*[!0-9]*|"") COUNT=3;; esac
          [ "$COUNT" -gt 4 ] && COUNT=4
          case "$LEVEL" in (*[!0-9]*|"") LEVEL=3;; esac
          case "$STAGE" in (*[!A-Za-z0-9-]*|"") STAGE=draft-1;; esac
          W_FLAGS="--writer $MODEL_A"; [ -n "$EFFORT_A" ] && W_FLAGS="$W_FLAGS --writer-effort $EFFORT_A"
          if [ -n "$MODEL_B" ]; then
            case "$MODEL_B" in (*[!A-Za-z0-9._/:-]*) echo "bad model_b"; exit 1;; esac
            case "$EFFORT_B" in (""|none|low|medium|high|default) ;; (*) echo "bad effort_b"; exit 1;; esac
            W_FLAGS="$W_FLAGS --fallback $MODEL_B"
            [ -n "$EFFORT_B" ] && W_FLAGS="$W_FLAGS --fallback-effort $EFFORT_B"
          fi
          # An input dispatched as "" is replaced by the input's DEFAULT, which
          # for manifest_path is a stored candidate file — that is how this run
          # silently became a stored-draft run against the wrong file. "none"
          # is the explicit way to ask for freshly composed manifests.
          case "$MANIFEST" in (none|fresh|-) MANIFEST="";; esac
          SRC="--count $COUNT --level $LEVEL"
          if [ -n "$MANIFEST" ]; then
            case "$MANIFEST" in (*[!A-Za-z0-9._/-]*|/*|*..*) echo "bad manifest_path"; exit 1;; esac
            [ -f "$MANIFEST" ] || { echo "candidate not found: $MANIFEST"; exit 1; }
            SRC="--candidate $MANIFEST --stage $STAGE"
          fi
          node draft-quality-pilot.mjs \
            --input reports/story-corpus-dump.json \
            $SRC $W_FLAGS --batch "$PREFIX" \
            --out "data/story-candidates/$PREFIX"

      - name: Fresh corpus dump for blueprint (read-only)
        if: inputs.mode == 'blueprint'
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node dump-story-corpus.mjs --out reports/story-corpus-dump.json

      - name: "Blueprint-first — plan, rank, realize at a fixed length, gate, repair"
        if: inputs.mode == 'blueprint'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MODEL_A: ${{ inputs.model_a }}      # Chinese realization + all judging (Qwen)
          EFFORT_A: ${{ inputs.effort_a }}
          MODEL_B: ${{ inputs.model_b }}      # second PLANNER, and line-repair fallback
          EFFORT_B: ${{ inputs.effort_b }}
          PREFIX: ${{ inputs.batch_prefix }}
          COUNT: ${{ inputs.count }}
          LEVEL: ${{ inputs.level }}
          LINES: ${{ inputs.writer_max_tokens }}   # reused: exact story length for this pilot
          MANIFEST: ${{ inputs.manifest_path }}    # stored artifact to reuse, or "none" to plan fresh
          STAGE: ${{ inputs.stage_name }}          # "scaffold" resumes a stored scaffold; anything else reuses the shape
        run: |
          set -e
          case "$PREFIX" in (*[!A-Za-z0-9_-]*|"") echo "bad batch_prefix"; exit 1;; esac
          case "$MODEL_A" in (""|*[!A-Za-z0-9._/:-]*) echo "bad or missing model_a"; exit 1;; esac
          case "$EFFORT_A" in (""|none|low|medium|high|default) ;; (*) echo "bad effort_a"; exit 1;; esac
          case "$COUNT" in (*[!0-9]*|"") COUNT=3;; esac
          if [ "$COUNT" -gt 4 ]; then COUNT=4; fi
          case "$LEVEL" in (*[!0-9]*|"") LEVEL=3;; esac
          case "$LINES" in (*[!0-9]*|"") LINES=28;; esac
          if [ "$LINES" -lt 14 ] || [ "$LINES" -gt 38 ]; then LINES=28; fi
          FLAGS="--writer $MODEL_A"
          if [ -n "$EFFORT_A" ]; then FLAGS="$FLAGS --writer-effort $EFFORT_A"; fi
          if [ -n "$MODEL_B" ]; then
            case "$MODEL_B" in (*[!A-Za-z0-9._/:-]*) echo "bad model_b"; exit 1;; esac
            case "$EFFORT_B" in (""|none|low|medium|high|default) ;; (*) echo "bad effort_b"; exit 1;; esac
            FLAGS="$FLAGS --planner-b $MODEL_B"
            if [ -n "$EFFORT_B" ]; then FLAGS="$FLAGS --planner-b-effort $EFFORT_B"; fi
          fi
          # manifest_path here means: reuse that stored artifact's STORY SHAPE
          # and rebuild its Chinese with the A3 lexical scaffold stage
          # ("none" = plan a fresh shape).
          SRC="--count $COUNT --level $LEVEL"
          case "$MANIFEST" in
            none|fresh|-|"") ;;
            *)
              # a comma-separated list is allowed for the preflight stage
              case "$MANIFEST" in (*[!A-Za-z0-9._/,-]*|/*|*..*) echo "bad manifest_path"; exit 1;; esac
              for f in $(echo "$MANIFEST" | tr ',' ' '); do
                if [ ! -f "$f" ]; then echo "artifact not found: $f"; exit 1; fi
              done
              case "$STAGE" in
                (scaffold) SRC="--resume-scaffold $MANIFEST";;
                # preflight also accepts "<artifact>,<viability.json>" so stored
                # placement verdicts are reused instead of re-judged.
                (preflight)
                  SRC="--preflight-only ${MANIFEST%%,*}"
                  case "$MANIFEST" in
                    (*,*) SRC="$SRC --viability-from ${MANIFEST#*,}";;
                  esac
                ;;
                # "shape:G" reuses one labelled plan out of a planner bakeoff.
                # manifest_path may be "<bakeoff.json>,<viability.json>" to
                # reuse that plan's stored placement verdicts instead of
                # re-judging them.
                (shape:*)
                  LBL="${STAGE#shape:}"
                  case "$LBL" in (*[!A-Za-z0-9_-]*|"") echo "bad shape label"; exit 1;; esac
                  SHAPE_SRC="${MANIFEST%%,*}"
                  SRC="--shape-from $SHAPE_SRC --shape-label $LBL"
                  case "$MANIFEST" in
                    (*,*) SRC="$SRC --viability-from ${MANIFEST#*,}";;
                  esac
                ;;
                (*) SRC="--shape-from $MANIFEST";;
              esac
            ;;
          esac
          node blueprint-pilot.mjs \
            --input reports/story-corpus-dump.json \
            $SRC --lines "$LINES" \
            $FLAGS --batch "$PREFIX" \
            --out "data/story-candidates/$PREFIX"
      - name: Fresh corpus dump for target-bundle (read-only)
        if: inputs.mode == 'target-bundle'
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node dump-story-corpus.mjs --out reports/story-corpus-dump.json

      - name: "Target bundle - which words the next story should teach"
        if: inputs.mode == 'target-bundle'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MODEL_A: ${{ inputs.model_a }}
          EFFORT_A: ${{ inputs.effort_a }}
          PREFIX: ${{ inputs.batch_prefix }}
          LEVEL: ${{ inputs.level }}
          COUNT: ${{ inputs.count }}
        run: |
          set -e
          case "$PREFIX" in (*[!A-Za-z0-9_-]*|"") echo "bad batch_prefix"; exit 1;; esac
          case "$MODEL_A" in (""|*[!A-Za-z0-9._/:-]*) echo "bad or missing model_a"; exit 1;; esac
          case "$EFFORT_A" in (""|none|low|medium|high|default) ;; (*) echo "bad effort_a"; exit 1;; esac
          case "$LEVEL" in (*[!0-9]*|"") LEVEL=3;; esac
          case "$COUNT" in (*[!0-9]*|"") COUNT=8;; esac
          if [ "$COUNT" -gt 16 ]; then COUNT=16; fi
          SPEC="$MODEL_A"
          if [ -n "$EFFORT_A" ]; then SPEC="$MODEL_A:$EFFORT_A"; fi
          node target-bundle.mjs \
            --input reports/story-corpus-dump.json \
            --model "$SPEC" --level "$LEVEL" --pool "$COUNT" \
            --out "data/story-candidates/$PREFIX"

      - name: Fresh corpus dump for planner-bakeoff (read-only)
        if: inputs.mode == 'planner-bakeoff'
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node dump-story-corpus.mjs --out reports/story-corpus-dump.json

      - name: "Planner bakeoff — same manifest, same prompt, only the model differs"
        if: inputs.mode == 'planner-bakeoff'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MODEL_A: ${{ inputs.model_a }}
          EFFORT_A: ${{ inputs.effort_a }}
          MODEL_B: ${{ inputs.model_b }}
          EFFORT_B: ${{ inputs.effort_b }}
          JUDGE: ${{ inputs.probe_models }}
          PREFIX: ${{ inputs.batch_prefix }}
          LEVEL: ${{ inputs.level }}
          COUNT: ${{ inputs.count }}
          LINES: ${{ inputs.writer_max_tokens }}
          MANIFEST: ${{ inputs.manifest_path }}
        run: |
          set -e
          case "$PREFIX" in (*[!A-Za-z0-9_-]*|"") echo "bad batch_prefix"; exit 1;; esac
          for spec in "$MODEL_A" "$MODEL_B" "$JUDGE"; do
            case "$spec" in ("") ;; (*[!A-Za-z0-9._/:-]*) echo "bad model spec: $spec"; exit 1;; esac
          done
          if [ -z "$MODEL_A" ]; then echo "model_a is required"; exit 1; fi
          case "$EFFORT_A" in (""|none|low|medium|high|default) ;; (*) echo "bad effort_a"; exit 1;; esac
          case "$EFFORT_B" in (""|none|low|medium|high|default) ;; (*) echo "bad effort_b"; exit 1;; esac
          case "$COUNT" in (*[!0-9]*|"") COUNT=6;; esac
          if [ "$COUNT" -gt 8 ]; then COUNT=8; fi
          case "$LEVEL" in (*[!0-9]*|"") LEVEL=3;; esac
          case "$LINES" in (*[!0-9]*|"") LINES=28;; esac
          MODELS="$MODEL_A"
          if [ -n "$EFFORT_A" ]; then MODELS="$MODEL_A:$EFFORT_A"; fi
          if [ -n "$MODEL_B" ]; then
            if [ -n "$EFFORT_B" ]; then MODELS="$MODELS,$MODEL_B:$EFFORT_B"; else MODELS="$MODELS,$MODEL_B"; fi
          fi
          JUDGE_FLAG=""
          if [ -n "$JUDGE" ]; then JUDGE_FLAG="--judge $JUDGE"; fi
          # manifest_path names a stored bakeoff to re-judge instead of
          # regenerating twelve plans.
          SRC="--models $MODELS"
          case "$MANIFEST" in
            none|fresh|-|"") ;;
            *)
              case "$MANIFEST" in (*[!A-Za-z0-9._/-]*|/*|*..*) echo "bad manifest_path"; exit 1;; esac
              if [ ! -f "$MANIFEST" ]; then echo "artifact not found: $MANIFEST"; exit 1; fi
              SRC="--rejudge $MANIFEST"
            ;;
          esac
          node planner-bakeoff.mjs \
            --input reports/story-corpus-dump.json \
            $SRC $JUDGE_FLAG \
            --per-model "$COUNT" --level "$LEVEL" --lines "$LINES" \
            --out "data/story-candidates/$PREFIX"

      - name: Show reports
        if: always()
        run: |
          for f in reports/llm-smoke.json data/story-candidates/*/batch-report.json; do
            [ -f "$f" ] || continue
            echo "::group::$f"
            cat "$f"
            echo "::endgroup::"
          done

      - name: Commit results to this branch
        if: always()
        run: |
          set -e
          git config user.name "llm-bench[bot]"
          git config user.email "llm-bench@users.noreply.github.com"
          mkdir -p reports
          git add -f reports/llm-smoke.json data/story-candidates 2>/dev/null || true
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "LLM bench (${{ inputs.mode }}) — provider probes / candidate artifacts (NOT staged)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llm-bench-${{ inputs.mode }}-${{ github.run_id }}
          path: |
            reports/llm-smoke.json
            data/story-candidates/
          if-no-files-found: ignore
