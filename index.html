<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- %BASE_URL% is replaced by Vite with the configured base ('/'). Kept as a
         placeholder so asset paths stay correct if the base ever changes. -->
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <meta name="theme-color" content="#B83A24" />

    <!-- Fonts: preconnect + direct link (not a CSS @import, which would
         serialize behind the app stylesheet and delay first text paint).
         This carries the UI faces and Noto Sans SC only — Chinese is the
         product, so its hanzi are on screen at first paint. A full CJK family
         is the most expensive thing this page fetches, and Noto Sans JP is
         needed only on the paused Japanese track's own screens, so it is
         loaded on demand instead (src/fontLoader.js) rather than by every
         learner who will never see it. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Home V3 uses the bundled Mona Sans face. Preload the common Latin
         subset so its editorial heading never paints in Inter and shifts on
         the next frame during a cold native launch. -->
    <link rel="preload" href="/src/assets/fonts/mona-sans-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Inter:wght@300;400;500;600&family=Poppins:wght@500;600;700&display=swap" />

    <title>Hanzi Dojo — Learn to read Chinese free</title>
    <meta name="description" content="Learn Chinese with SRS flashcards and stories matched to the words you know. Free forever, no credit card." />

    <!-- Social share preview. og:url / og:image must be ABSOLUTE URLs — scrapers
         (Twitter, Discord, iMessage) don't resolve relative paths. Point them at
         the canonical domain so previews never surface the raw GitHub Pages host. -->
    <meta property="og:title" content="Hanzi Dojo" />
    <meta property="og:description" content="Learn Chinese with SRS flashcards and stories matched to the words you know. Free forever." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://hanzi-dojo.com/" />
    <meta property="og:image" content="https://hanzi-dojo.com/icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Hanzi Dojo" />
    <meta name="twitter:description" content="Learn Chinese with SRS flashcards and stories matched to the words you know. Free forever." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
